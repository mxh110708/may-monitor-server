name: Reviewed monitoring profile checks
on:
  workflow_dispatch:
    inputs:
      frontend_commit:
        description: Reviewed commit from mxh110708/may-monitor-web (40 hex characters)
        required: true
        type: string
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate reviewed frontend revision
        env:
          FRONTEND_COMMIT: ${{ inputs.frontend_commit }}
        run: |
          [[ "$FRONTEND_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]
          python3 -c 'import json, os; lock=json.load(open("frontend.lock.json")); assert lock["repository"]=="mxh110708/may-monitor-web"; assert os.environ["FRONTEND_COMMIT"]==lock["commit"], "Frontend differs from the reviewed release lock"'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: mxh110708/may-monitor-web
          ref: ${{ inputs.frontend_commit }}
          path: reviewed-web
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.27.3
      - name: Verify and build locked frontend
        working-directory: reviewed-web
        run: |
          npm ci --ignore-scripts
          npm audit
          npm run test:security
          npm run test:onboarding
          npm run lint
          npm run build
          npm run test:service-worker
      - name: Pack exactly the reviewed frontend
        run: |
          go run ./tools/packfrontend reviewed-web/dist web/public/defaultTheme/dist.tar.zst
          cp reviewed-web/komari-theme.json web/public/defaultTheme/komari-theme.json
      - name: Server regression and dependency checks
        run: |
          go mod verify
          go test -count=1 -timeout=10m ./...
          go test -race -count=1 ./securityaudit ./web/security ./web/oauth/factory ./web/connection
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
